# ============================================================
# FixItNow Platform - Application Configuration
# ============================================================

spring.application.name=FixItNow

# Optional local-only overrides for secrets (gitignored). Lets you run without
# exporting env vars. See application-local.properties (not committed).
spring.config.import=optional:application-local.properties

# ------------------------------------------------------------
# Database - MySQL
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fixitnow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
# validate = check schema matches entities (use update during dev, validate in prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# JWT Security
# ------------------------------------------------------------
# Secret key for signing JWT tokens. MUST be provided via JWT_SECRET env var in production
# (>= 256 bits / 32 bytes for HS256). The default below is for local dev only.
jwt.secret=${JWT_SECRET:fixitnow-local-dev-secret-key-not-for-production-use-256-bits}
# Access token expiry: 24 hours in milliseconds
jwt.expiration=${JWT_EXPIRATION:86400000}
# Refresh token expiry: 7 days in milliseconds
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ------------------------------------------------------------
# Google OAuth2 ("Sign in with Google")
# Provide credentials via env vars; OAuth login is auto-disabled when client-id is blank.
# Authorized redirect URI to register in Google Cloud Console:
#   http://localhost:8080/login/oauth2/code/google
# ------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
# Where the backend sends the browser after a successful Google login (tokens in URL fragment).
app.oauth2.frontend-redirect-uri=${OAUTH_FRONTEND_REDIRECT:http://localhost:3000/oauth/callback}

# ------------------------------------------------------------
# Stripe Payment Gateway
# ------------------------------------------------------------
# Provide via STRIPE_SECRET_KEY env var; placeholder default for local dev.
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_your_stripe_secret_key}

# ------------------------------------------------------------
# Google Maps API (GPS Tracking & ETA)
# ------------------------------------------------------------
# Provide via GOOGLE_MAPS_API_KEY env var; placeholder default for local dev.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:your_google_maps_api_key}

# ------------------------------------------------------------
# Email Notifications (Gmail SMTP)
# ------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@fixitnow.com}

# ------------------------------------------------------------
# File Upload (for provider verification documents)
# ------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=./uploads

# ------------------------------------------------------------
# Server
# ------------------------------------------------------------
# Aligned with the frontend axios base URL (VITE_API_BASE_URL_DEV=http://localhost:8080).
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------
# CORS - allowed browser origins (comma-separated). The Vite dev server
# runs on :3000; :8080 kept for flexibility. Override via CORS_ALLOWED_ORIGINS.
# ------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# ------------------------------------------------------------
# Logging - structured output for monitoring (SRS §2.1.4)
# Application logs: 90 days retention handled by external log aggregator
# ------------------------------------------------------------
logging.level.com.fixitnow=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
