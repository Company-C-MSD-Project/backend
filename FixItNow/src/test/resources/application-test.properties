# Test-profile configuration (activated by @ActiveProfiles("test")).
#
# Provides a DUMMY Google OAuth client registration so the OAuth2 client
# auto-configuration always has a ClientRegistrationRepository when the full
# Spring context boots in @SpringBootTest. The tests never contact Google — this
# only satisfies the bean wiring. Without it, a context with no real OAuth creds
# (e.g. CI, or a fresh clone with no application-local.properties) fails to start.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# Datasource is intentionally NOT set here — it is inherited from
# application.properties (env-overridable), so locally it uses your dev MySQL and
# in CI it points at the MySQL service container via DB_URL / DB_PASSWORD.
