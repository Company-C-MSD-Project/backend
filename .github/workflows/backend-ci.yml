name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (JUnit)
    runs-on: ubuntu-latest

    # The integration / acceptance tests boot the full Spring context, which needs a
    # database. A MySQL 8 service container provides one for the duration of the job.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: fixitnow_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DB_URL: "jdbc:mysql://127.0.0.1:3306/fixitnow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: testpassword
      JWT_SECRET: "ci-only-jwt-secret-key-minimum-32-characters-long-2026"
      # Dummy non-empty OAuth client so every @SpringBootTest context (including the
      # default-profile FixItNowApplicationTests) can build the Google client
      # registration. The tests never contact Google.
      GOOGLE_OAUTH_CLIENT_ID: "ci-dummy-client-id"
      GOOGLE_OAUTH_CLIENT_SECRET: "ci-dummy-client-secret"

    defaults:
      run:
        working-directory: FixItNow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -ptestpassword --silent; then
              echo "MySQL is up"; break
            fi
            echo "Waiting for MySQL... ($i)"; sleep 2
          done

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: FixItNow/target/surefire-reports/
          if-no-files-found: ignore

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never run two backend deploys at once; don't cancel an in-flight deploy.
    concurrency:
      group: deploy-backend-ec2
      cancel-in-progress: false
    env:
      EC2_HOST: "44.203.20.87"
      EC2_USER: "ec2-user"
      SITE: "https://fixitnow.chanupahansaja.me"
    defaults:
      run:
        working-directory: FixItNow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar (tests already passed in 'test' job)
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests clean package
          # Safety: ensure no local secrets file leaked into the jar
          if unzip -l target/FixItNow-*.jar | grep -q "BOOT-INF/classes/application-local.properties$"; then
            echo "::error::application-local.properties is bundled in the jar — aborting"; exit 1
          fi

      - name: Set up SSH (pinned host key)
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload jar to instance
        run: |
          JAR=$(ls target/FixItNow-*.jar | grep -v original | head -1)
          echo "Uploading $JAR"
          scp -i ~/.ssh/id_deploy -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes \
            "$JAR" "$EC2_USER@$EC2_HOST:/tmp/app-new.jar"

      - name: Deploy + health-check + rollback on failure
        run: |
          ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" bash -s <<'EOSSH'
          set -e
          APP=/opt/fixitnow/app.jar
          sudo cp -f "$APP" "$APP.bak" || true
          sudo cp /tmp/app-new.jar "$APP"
          sudo systemctl restart fixitnow
          ok=0
          for i in $(seq 1 40); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/service-categories)" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "Health check FAILED — rolling back to previous jar"
            sudo cp "$APP.bak" "$APP"
            sudo systemctl restart fixitnow
            exit 1
          fi
          echo "Backend healthy after deploy"
          EOSSH

      - name: System test (live HTTPS)
        run: |
          set -e
          c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$SITE/api/v1/service-categories")
          echo "GET $SITE/api/v1/service-categories -> $c"; [ "$c" = "200" ]
          o=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$SITE/api/v1/auth/oauth/google")
          echo "GET $SITE/api/v1/auth/oauth/google -> $o (expect 302)"; [ "$o" = "302" ]
          echo "✅ Backend system tests passed"
